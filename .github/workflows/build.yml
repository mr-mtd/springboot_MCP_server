name: build

# Docs-only changes (Markdown files) don't build, publish or deploy.
on:
  push:
    branches: [main, feature/dev]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests start Postgres 18 with Testcontainers; Docker is already on ubuntu-latest.
      - name: Build and test
        run: mvn -B -ntp verify

      # Checks that the Dockerfile still builds; the image isn't pushed anywhere.
      - name: Build Docker image
        run: docker build -t transport-mcp-server:ci .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # On pushes to main and feature/dev (not PRs), publish the image to GitHub Container Registry.
  # The EC2 host pulls ghcr.io/mr-mtd/transport-mcp-server:<branch tag>.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/transport-mcp-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # After a push to main publishes a new image, restart the container on the EC2 host.
  # GitHub signs in to AWS with OIDC (no stored AWS keys) as a role that may only run commands on
  # that one instance. The command runs /opt/transport-mcp/run.sh (pull + restart) and then waits
  # for /actuator/health to report UP. Skipped until the repo variables below are set.
  #
  # Repository variables (Settings > Secrets and variables > Actions > Variables):
  #   AWS_DEPLOY_ROLE_ARN  arn:aws:iam::<account>:role/transport-mcp-github-deploy
  #   EC2_INSTANCE_ID      i-...
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
    steps:
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pull and restart on EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters '{"commands":[
              "set -e",
              "/opt/transport-mcp/run.sh",
              "for i in $(seq 1 30); do if curl -fs localhost:8080/actuator/health | grep -q UP; then echo healthy; exit 0; fi; sleep 5; done",
              "echo not healthy after 150s; docker logs --tail 80 transport-mcp-server; exit 1"
            ]}' \
            --query Command.CommandId --output text)
          echo "SSM command $COMMAND_ID"

          # Poll instead of `aws ssm wait`, which gives up after 100 s.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json \
            | tee result.json
          test "$(jq -r .Status result.json)" = "Success"
